<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f2eee7">
<meta name="description" content="把两个一样的水果软糖碰在一起，合成更大的，目标：大西瓜。">
<title>合成大西瓜</title>
<style>
  :root {
    --paper: #f2eee7;
    --card: #fbf9f5;
    --ink: #1f1b16;
    --muted: #7d756b;
    --faint: #a59d92;
    --line: rgba(31, 27, 22, .1);
    --serif: "Iowan Old Style", "Palatino", "Songti SC", "Noto Serif SC", "Noto Serif CJK SC", "STSong", "SimSun", Georgia, serif;
    --sans: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--paper); color: var(--ink);
    font-family: var(--sans);
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  body { position: fixed; inset: 0; touch-action: none; }
  canvas { display: block; }
  #c { position: absolute; left: 0; top: 0; touch-action: none; }

  .ov {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(242, 238, 231, .55);
    -webkit-backdrop-filter: blur(10px) saturate(1.1); backdrop-filter: blur(10px) saturate(1.1);
    padding: 16px; box-sizing: border-box;
    transition: opacity .4s ease;
  }
  .ov.hide { opacity: 0; pointer-events: none; }
  .card {
    width: 100%; max-width: 340px; text-align: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 22px;
    padding: 30px 24px 22px; box-sizing: border-box;
    box-shadow: 0 30px 60px -24px rgba(70, 45, 20, .28), 0 2px 6px rgba(70, 45, 20, .05);
    animation: rise .6s cubic-bezier(.2, .9, .25, 1);
  }
  @keyframes rise { from { transform: translateY(18px); opacity: 0; } }
  .eyebrow {
    font-size: 10px; letter-spacing: .28em; text-transform: uppercase; color: var(--faint);
    margin: 0 0 8px;
  }
  h1, h2, .serif { font-family: var(--serif); font-weight: 500; }
  h1 { margin: 2px 0 10px; font-size: 38px; letter-spacing: .08em; }
  h2 { margin: 0; font-size: 15px; letter-spacing: .1em; color: var(--muted); }
  p { margin: 8px 0; font-size: 14px; line-height: 1.75; color: var(--muted); }
  .hero { width: 132px; height: 132px; margin: -4px auto 4px; animation: float 3.2s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-7px) rotate(-3deg); } }
  .chain {
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 3px;
    margin: 16px 0 20px; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  }
  .chain canvas { width: 22px; height: 22px; }
  .score { font-family: var(--serif); font-size: 68px; line-height: 1; margin: 10px 0 18px; font-weight: 400; }
  .meta {
    display: grid; grid-template-columns: 1fr 1fr; margin: 0 0 18px;
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  }
  .meta div { padding: 12px 4px; }
  .meta div + div { border-left: 1px solid var(--line); }
  .meta b { display: block; font-family: var(--serif); font-weight: 500; font-size: 17px; margin-top: 4px; color: var(--ink); }
  .meta span { font-size: 10px; letter-spacing: .2em; color: var(--faint); }
  .msg { font-family: var(--serif); font-style: italic; color: var(--ink); font-size: 16px; margin: 0 0 18px; }
  button.go {
    display: block; width: 100%; border: 0; border-radius: 999px;
    padding: 15px 0; margin: 0;
    font-family: var(--sans); font-size: 15px; font-weight: 500; letter-spacing: .3em; text-indent: .3em;
    color: var(--paper); background: var(--ink); cursor: pointer;
    transition: transform .15s ease, opacity .15s;
  }
  button.go:active { transform: scale(.97); opacity: .85; }
  .fine { font-size: 11px; color: var(--faint); margin: 14px 0 0; letter-spacing: .04em; }
  #snd {
    position: absolute; right: 14px; bottom: calc(12px + env(safe-area-inset-bottom));
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--line); background: rgba(251, 249, 245, .8);
    display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer;
    color: var(--ink);
  }
  #snd svg { width: 16px; height: 16px; }
  #snd .off { display: none; }
  #snd.muted .on { display: none; }
  #snd.muted .off { display: inline; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="snd" aria-label="声音开关">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/>
    <path class="on" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>
    <path class="off" d="M16 9.5l5 5M21 9.5l-5 5"/>
  </svg>
</button>

<div id="start" class="ov">
  <div class="card">
    <p class="eyebrow">A Study in Fruit Jelly</p>
    <canvas class="hero" id="hero"></canvas>
    <h1>合成大西瓜</h1>
    <p>左右拖动瞄准，松手放下。<br>两颗相同的果冻相碰，便会合成更大的一颗。</p>
    <div class="chain" id="chain"></div>
    <button class="go" id="go">开始</button>
    <p class="fine" id="bestStart">&nbsp;</p>
  </div>
</div>

<div id="end" class="ov hide">
  <div class="card">
    <p class="eyebrow">Result · 本局</p>
    <div class="score" id="finalScore">0</div>
    <div class="meta">
      <div><span>最高分</span><b id="finalBest">0</b></div>
      <div><span>最大标本</span><b id="finalFruit">—</b></div>
    </div>
    <p class="msg" id="finalMsg"></p>
    <button class="go" id="again">再来一局</button>
    <p class="fine">点右上角「···」分享给朋友，看谁先合成大西瓜</p>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ---------- 世界设定（逻辑坐标，自动缩放到屏幕） ----------
  const W = 400, H = 720;
  const HOVER_Y = 118, DEAD = 160, FLOOR = 684;
  const G = 1900, STEP = 1 / 240, VITER = 6, PITER = 3;
  const TAU = Math.PI * 2;
  const SERIF = '"Iowan Old Style","Palatino","Songti SC","Noto Serif SC","Noto Serif CJK SC","STSong","SimSun",Georgia,serif';
  const SANS = '-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
  const INK = '#1f1b16';

  // c：果冻外皮颜色；j：果肉/果汁颜色（用于溅射和投影）
  const FRUITS = [
    { n: '樱桃',   c: '#a3122c', j: '#d42a45', r: 18 },
    { n: '草莓',   c: '#e0344a', j: '#ff6272', r: 25 },
    { n: '葡萄',   c: '#5e2a85', j: '#c7df8e', r: 33 },
    { n: '橘子',   c: '#f28a1d', j: '#ffa53a', r: 40 },
    { n: '柠檬',   c: '#eec21a', j: '#ffe066', r: 48 },
    { n: '猕猴桃', c: '#6b5230', j: '#7cc242', r: 57 },
    { n: '番茄',   c: '#d9331c', j: '#ff5a3a', r: 66 },
    { n: '桃子',   c: '#e8604a', j: '#ffb56a', r: 77 },
    { n: '菠萝',   c: '#a07a24', j: '#fbd84a', r: 88 },
    { n: '椰子',   c: '#5e3b22', j: '#efe9dc', r: 100 },
    { n: '大西瓜', c: '#2a6431', j: '#ff5a6e', r: 118 },
  ];
  const MAX = FRUITS.length - 1;
  const POINTS = [0, 1, 3, 6, 10, 15, 21, 28, 36, 45, 100];
  const NOTES = [392, 440, 523, 587, 659, 784, 880, 1047, 1175, 1319, 1568];
  const no = l => 'Nº ' + String(l + 1).padStart(2, '0');

  const $ = id => document.getElementById(id);
  const cv = $('c'), ctx = cv.getContext('2d');
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const rand = (a, b) => a + Math.random() * (b - a);

  // ---------- 本地存储 ----------
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  let best = +store.get('xigua-best') || 0;

  // ---------- 画布与精灵 ----------
  let dpr = 1, cw = 0, ch = 0, sc = 1, ox = 0, oy = 0, sprites = [];

  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    const t = amt > 0 ? 255 : 0, p = Math.abs(amt);
    r = Math.round(r + (t - r) * p); g = Math.round(g + (t - g) * p); b = Math.round(b + (t - b) * p);
    return `rgb(${r},${g},${b})`;
  }
  const rgba = (hex, a) => {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
  };

  // 固定种子的随机数，保证每次重绘花纹一致
  function seeded(seed) {
    return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  }

  // ---------- 各水果横切面花纹（在 detail 层里画，随滚动旋转） ----------
  function disc(g, m, r, fill) { g.beginPath(); g.arc(m, m, r, 0, TAU); g.fillStyle = fill; g.fill(); }
  function radial(g, m, r0, r1, stops) {
    const gr = g.createRadialGradient(m, m, r0, m, m, r1);
    stops.forEach(([o, c]) => gr.addColorStop(o, c));
    return gr;
  }
  function spokes(g, m, n, r0, r1, color, width, jitter, rnd) {
    g.strokeStyle = color; g.lineWidth = width; g.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU + (jitter ? (rnd() - .5) * jitter : 0);
      g.beginPath();
      g.moveTo(m + Math.cos(a) * r0, m + Math.sin(a) * r0);
      g.lineTo(m + Math.cos(a) * r1, m + Math.sin(a) * r1);
      g.stroke();
    }
  }
  function seed(g, x, y, rx, ry, rot, fill) {
    g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, TAU); g.fillStyle = fill; g.fill();
  }
  function citrus(g, m, R, n, rind, membrane, pulpIn, pulpOut) {
    disc(g, m, R * .97, rind);
    disc(g, m, R * .86, membrane);
    for (let i = 0; i < n; i++) {
      const a0 = i / n * TAU, a1 = (i + 1) / n * TAU, mid = (a0 + a1) / 2, gap = .045;
      g.beginPath();
      g.moveTo(m + Math.cos(mid) * R * .1, m + Math.sin(mid) * R * .1);
      g.arc(m, m, R * .82, a0 + gap, a1 - gap);
      g.closePath();
      g.fillStyle = radial(g, m, R * .08, R * .82, [[0, pulpIn], [1, pulpOut]]);
      g.fill();
      g.strokeStyle = 'rgba(255,255,255,.22)'; g.lineWidth = R * .014; g.lineCap = 'round';
      for (let s = 1; s < 4; s++) {
        const a = a0 + s / 4 * (a1 - a0);
        g.beginPath();
        g.moveTo(m + Math.cos(a) * R * .28, m + Math.sin(a) * R * .28);
        g.lineTo(m + Math.cos(a) * R * .74, m + Math.sin(a) * R * .74);
        g.stroke();
      }
    }
    disc(g, m, R * .1, membrane);
  }

  const DETAILS = [
    // 樱桃：深红果肉 + 奶色果核
    (g, m, R) => {
      disc(g, m, R * .9, radial(g, m, 0, R * .9, [[0, '#e0394f'], [1, '#8e0f25']]));
      seed(g, m, m, R * .24, R * .3, 0, 'rgba(246,214,182,.92)');
      seed(g, m - R * .05, m - R * .08, R * .08, R * .12, 0, 'rgba(255,255,255,.5)');
    },
    // 草莓：浅色芯 + 放射纹 + 边缘籽
    (g, m, R, rnd) => {
      disc(g, m, R * .92, radial(g, m, 0, R * .92, [[0, '#ffe3e4'], [.45, '#ff8a95'], [1, '#e02c42']]));
      spokes(g, m, 14, R * .12, R * .66, 'rgba(255,255,255,.35)', R * .035, .2, rnd);
      for (let i = 0; i < 12; i++) {
        const a = i / 12 * TAU;
        seed(g, m + Math.cos(a) * R * .8, m + Math.sin(a) * R * .8, R * .045, R * .07, a, '#ffd86b');
      }
    },
    // 葡萄：紫皮 + 青绿果肉 + 两粒籽
    (g, m, R, rnd) => {
      disc(g, m, R * .84, radial(g, m, 0, R * .84, [[0, '#eef6cf'], [.7, '#c8e08e'], [1, '#9fbf5c']]));
      spokes(g, m, 10, R * .2, R * .7, 'rgba(255,255,255,.28)', R * .025, .3, rnd);
      seed(g, m - R * .16, m + R * .02, R * .07, R * .13, .3, 'rgba(150,110,50,.85)');
      seed(g, m + R * .16, m - R * .02, R * .07, R * .13, -.3, 'rgba(150,110,50,.85)');
    },
    // 橘子
    (g, m, R) => citrus(g, m, R, 10, '#f7a23a', '#ffe7c2', '#ffc46b', '#f7861b'),
    // 柠檬
    (g, m, R) => citrus(g, m, R, 9, '#f5d33a', '#fff6cf', '#fff08c', '#f2cc1c'),
    // 猕猴桃：棕皮 + 绿果肉 + 白芯 + 一圈黑籽
    (g, m, R, rnd) => {
      disc(g, m, R * .93, radial(g, m, R * .2, R * .93, [[0, '#b9dd6a'], [.5, '#7cc242'], [1, '#4f9124']]));
      spokes(g, m, 44, R * .3, R * .88, 'rgba(240,250,205,.28)', R * .012, .08, rnd);
      disc(g, m, R * .26, radial(g, m, 0, R * .26, [[0, '#fbfbe6'], [1, '#e6efb4']]));
      for (let i = 0; i < 34; i++) {
        const a = i / 34 * TAU + rnd() * .1, d = R * (.34 + rnd() * .12);
        seed(g, m + Math.cos(a) * d, m + Math.sin(a) * d, R * .045, R * .02, a, '#231a10');
      }
    },
    // 番茄：三个果腔 + 籽
    (g, m, R, rnd) => {
      disc(g, m, R * .94, radial(g, m, 0, R * .94, [[0, '#ffb190'], [.35, '#f0573a'], [1, '#c92a17']]));
      for (let i = 0; i < 3; i++) {
        const a = i / 3 * TAU - Math.PI / 2, cx = m + Math.cos(a) * R * .46, cy = m + Math.sin(a) * R * .46;
        g.beginPath(); g.ellipse(cx, cy, R * .3, R * .22, a + Math.PI / 2, 0, TAU);
        g.fillStyle = 'rgba(255,150,110,.8)'; g.fill();
        for (let s = 0; s < 6; s++) {
          const sa = rnd() * TAU, sd = rnd() * R * .15;
          seed(g, cx + Math.cos(sa) * sd, cy + Math.sin(sa) * sd, R * .04, R * .026, sa, '#fff1b8');
        }
      }
      disc(g, m, R * .14, 'rgba(255,190,160,.9)');
    },
    // 桃子：果肉 + 红晕 + 果核
    (g, m, R, rnd) => {
      disc(g, m, R * .93, radial(g, m, R * .2, R * .93, [[0, '#ffcf8a'], [1, '#f7a04e']]));
      disc(g, m, R * .5, radial(g, m, R * .15, R * .5, [[0, 'rgba(210,55,50,.85)'], [1, 'rgba(210,55,50,0)']]));
      seed(g, m, m, R * .2, R * .27, 0, '#8a4a2b');
      g.strokeStyle = 'rgba(60,25,10,.45)'; g.lineWidth = R * .018;
      for (let i = 0; i < 7; i++) {
        const y = m - R * .2 + i * R * .066, w = Math.sqrt(Math.max(0, 1 - ((y - m) / (R * .27)) ** 2)) * R * .17;
        g.beginPath(); g.moveTo(m - w, y + (rnd() - .5) * R * .02); g.quadraticCurveTo(m, y + R * .03, m + w, y); g.stroke();
      }
    },
    // 菠萝：纤维纹 + 浅色芯 + 外圈“果眼”
    (g, m, R, rnd) => {
      disc(g, m, R * .92, radial(g, m, R * .2, R * .92, [[0, '#fde9a0'], [.5, '#f9d34a'], [1, '#e9b418']]));
      spokes(g, m, 60, R * .24, R * .84, 'rgba(255,248,210,.35)', R * .012, .05, rnd);
      disc(g, m, R * .22, radial(g, m, 0, R * .22, [[0, '#fff6d2'], [1, '#fbe49a']]));
      for (let i = 0; i < 22; i++) {
        const a = i / 22 * TAU;
        seed(g, m + Math.cos(a) * R * .87, m + Math.sin(a) * R * .87, R * .03, R * .05, a, 'rgba(120,80,20,.55)');
      }
    },
    // 椰子：毛壳 + 白色果肉 + 半透明椰汁
    (g, m, R, rnd) => {
      g.strokeStyle = 'rgba(30,15,5,.35)'; g.lineWidth = R * .012;
      for (let i = 0; i < 90; i++) {
        const a = rnd() * TAU, d = R * (.88 + rnd() * .08);
        g.beginPath(); g.moveTo(m + Math.cos(a) * d, m + Math.sin(a) * d);
        g.lineTo(m + Math.cos(a + .05) * (d + R * .05), m + Math.sin(a + .05) * (d + R * .05)); g.stroke();
      }
      disc(g, m, R * .84, '#f8f4ec');
      disc(g, m, R * .62, radial(g, m, 0, R * .62, [[0, 'rgba(236,242,244,.95)'], [1, 'rgba(206,220,226,.95)']]));
    },
    // 西瓜：深绿皮 + 白瓤 + 红果肉 + 黑籽
    (g, m, R, rnd) => {
      g.strokeStyle = 'rgba(15,50,20,.5)'; g.lineWidth = R * .05;
      for (let i = 0; i < 16; i++) {
        const a = i / 16 * TAU;
        g.beginPath(); g.arc(m, m, R * .95, a, a + .12); g.stroke();
      }
      disc(g, m, R * .9, '#d9ecb2');
      disc(g, m, R * .84, radial(g, m, 0, R * .84, [[0, '#ff8190'], [.7, '#f5485d'], [1, '#e2344b']]));
      spokes(g, m, 30, R * .1, R * .78, 'rgba(255,220,225,.18)', R * .02, .1, rnd);
      for (let i = 0; i < 13; i++) {
        const a = i / 13 * TAU + .2, d = R * (.52 + (i % 2) * .1);
        seed(g, m + Math.cos(a) * d, m + Math.sin(a) * d, R * .06, R * .035, a, '#1c1410');
        seed(g, m + Math.cos(a) * d - R * .012, m + Math.sin(a) * d - R * .012, R * .02, R * .01, a, 'rgba(255,255,255,.35)');
      }
      for (let i = 0; i < 5; i++) {
        const a = i / 5 * TAU, d = R * .22;
        seed(g, m + Math.cos(a) * d, m + Math.sin(a) * d, R * .05, R * .03, a, '#1c1410');
      }
    },
  ];

  function buildSprites() {
    const k = sc * dpr;
    sprites = FRUITS.map((f, l) => {
      const R = f.r * k, pad = R * .3 + 4 * k, size = Math.ceil(2 * (R + pad)), m = size / 2;
      const layer = draw => {
        const c = document.createElement('canvas');
        c.width = c.height = size;
        const g = c.getContext('2d');
        draw(g);
        return c;
      };
      const circle = g => { g.beginPath(); g.arc(m, m, R, 0, TAU); };

      const base = layer(g => {
        // 果冻透光投下的彩色光斑 + 接触阴影
        g.save(); g.translate(m + R * .08, m + R * .95); g.scale(1, .2);
        g.fillStyle = radial(g, 0, 0, R * 1.05, [[0, rgba(f.j, .3)], [1, rgba(f.j, 0)]]);
        g.beginPath(); g.arc(0, 0, R * 1.05, 0, TAU); g.fill();
        g.fillStyle = radial(g, 0, 0, R * .7, [[0, 'rgba(50,30,15,.26)'], [1, 'rgba(50,30,15,0)']]);
        g.beginPath(); g.arc(0, 0, R * .7, 0, TAU); g.fill();
        g.restore();
        // 外皮
        const body = g.createRadialGradient(m - R * .3, m - R * .4, R * .05, m, m, R);
        body.addColorStop(0, shade(f.c, .35));
        body.addColorStop(.75, f.c);
        body.addColorStop(1, shade(f.c, -.25));
        circle(g); g.fillStyle = body; g.fill();
      });

      const detail = layer(g => {
        g.globalAlpha = .94;
        DETAILS[l](g, m, R, seeded(l * 97 + 13));
      });

      const gloss = layer(g => {
        g.save(); circle(g); g.clip();
        // 体积感：背光一侧边缘变暗
        const vol = g.createRadialGradient(m - R * .25, m - R * .3, R * .2, m, m, R * 1.02);
        vol.addColorStop(0, 'rgba(40,20,10,0)'); vol.addColorStop(.72, 'rgba(40,20,10,0)'); vol.addColorStop(1, 'rgba(40,20,10,.3)');
        g.fillStyle = vol; g.fillRect(0, 0, size, size);
        // 次表面散射：光从底部透出来
        const sss = g.createRadialGradient(m + R * .15, m + R * .62, 0, m + R * .15, m + R * .62, R * .6);
        sss.addColorStop(0, 'rgba(255,255,255,.3)'); sss.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = sss; g.fillRect(0, 0, size, size);
        g.restore();
        // 大片柔光
        g.save(); g.translate(m - R * .3, m - R * .42); g.rotate(-.55); g.scale(1, .55);
        g.fillStyle = radial(g, 0, 0, R * .5, [[0, 'rgba(255,255,255,.72)'], [.6, 'rgba(255,255,255,.18)'], [1, 'rgba(255,255,255,0)']]);
        g.beginPath(); g.arc(0, 0, R * .5, 0, TAU); g.fill();
        g.restore();
        // 窗形高光
        seed(g, m - R * .44, m - R * .5, R * .13, R * .07, -.65, 'rgba(255,255,255,.92)');
        seed(g, m - R * .22, m - R * .66, R * .04, R * .025, -.4, 'rgba(255,255,255,.8)');
        // 边缘轮廓光
        g.lineCap = 'round';
        g.beginPath(); g.arc(m, m, R * .955, Math.PI * 1.05, Math.PI * 1.45);
        g.lineWidth = R * .035; g.strokeStyle = 'rgba(255,255,255,.55)'; g.stroke();
        g.beginPath(); g.arc(m, m, R * .89, Math.PI * .15, Math.PI * .7);
        g.lineWidth = R * .05; g.strokeStyle = 'rgba(255,255,255,.28)'; g.stroke();
        circle(g); g.lineWidth = Math.max(1, R * .02); g.strokeStyle = 'rgba(30,15,5,.14)'; g.stroke();
      });

      return { base, detail, gloss, size: size / k };
    });
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    cw = window.innerWidth; ch = window.innerHeight;
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
    cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
    sc = Math.min(cw / W, ch / H);
    ox = (cw - W * sc) / 2; oy = (ch - H * sc) / 2;
    buildSprites();
    paintIcons();
  }

  // ---------- 声音（WebAudio 合成，无需外部文件） ----------
  let actx = null, muted = false;
  function tone(f1, f2, dur, type, vol, delay) {
    if (!actx || muted || demo) return;
    const t = actx.currentTime + (delay || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || .2, t + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + .03);
  }
  const sfx = {
    drop() { tone(260, 140, .12, 'sine', .2); },
    merge(l) { const f = NOTES[l]; tone(f, f * 1.5, .16, 'triangle', .22); tone(f * 2, f * 2.5, .1, 'sine', .06, .03); },
    win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, f * 1.01, .35, 'triangle', .22, i * .11)); },
    over() { tone(440, 110, .7, 'sawtooth', .08); },
  };
  function unlockAudio() {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    } catch (e) {}
  }
  const vibrate = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

  // ---------- 游戏状态 ----------
  let bodies = [], parts = [], floats = [], fireworks = [];
  let score = 0, shownScore = 0, cur = 0, next = 0, aimX = W / 2, aiming = false;
  let cooldown = 0, dangerT = 0, maxLvl = 0, banner = null, shake = 0;
  let over = true, demo = true, demoT = 0, dropped = 0, time = 0;

  function randLevel() {
    if (dropped < 3) return [0, 0, 1][dropped];
    const pool = [0, 0, 0, 1, 1, 1, 2, 2, 3, 4];
    return pool[(Math.random() * pool.length) | 0];
  }

  function makeBody(l, x, y, vx, vy) {
    const r = FRUITS[l].r;
    return { l, x, y, vx, vy, r, tr: r, gr: 0, a: rand(-.4, .4), t: 0, dead: false, sq: 0, sv: 0, ang: Math.PI / 2 };
  }

  function reset(asDemo) {
    bodies = []; parts = []; floats = []; fireworks = [];
    score = shownScore = 0; dropped = 0; maxLvl = 0; dangerT = 0; banner = null; cooldown = 0;
    demo = asDemo; over = asDemo;
    cur = randLevel(); dropped = 1; next = randLevel(); dropped = 0;
    document.title = '合成大西瓜';
  }

  function drop(x) {
    if (over || cooldown > 0) return;
    const r = FRUITS[cur].r;
    bodies.push(makeBody(cur, clamp(x, r, W - r), HOVER_Y, 0, 0));
    sfx.drop();
    dropped++;
    cur = next; next = randLevel();
    cooldown = .45;
  }

  // ---------- 物理（速度冲量 + 位置修正，堆叠稳定） ----------
  function step(dt) {
    const n = bodies.length, merges = [];
    for (const b of bodies) {
      b.vy += G * dt;
      if (b.r < b.tr) b.r = Math.min(b.tr, b.r + b.gr * dt);
      const K = 520 * Math.sqrt(40 / b.r);
      b.sv += (-K * b.sq - 5.5 * b.sv) * dt;
      b.sq = clamp(b.sq + b.sv * dt, -.22, .3);
    }
    // 速度层：接触处消除相互靠近的速度（带一点弹性和摩擦）
    for (let k = 0; k < VITER; k++) {
      for (let i = 0; i < n; i++) {
        const a = bodies[i];
        for (let j = i + 1; j < n; j++) {
          const b = bodies[j];
          const dx = b.x - a.x, dy = b.y - a.y, rs = a.r + b.r + 1;
          const d2 = dx * dx + dy * dy;
          if (d2 >= rs * rs) continue;
          const d = Math.sqrt(d2) || 1e-4, nx = dx / d, ny = dy / d;
          const rvx = b.vx - a.vx, rvy = b.vy - a.vy, vn = rvx * nx + rvy * ny;
          if (vn >= 0) continue;
          const wa = 1 / (a.r * a.r), wb = 1 / (b.r * b.r), wt = wa + wb;
          if (k === 0 && vn < -90) {
            const ang = Math.atan2(ny, nx);
            squish(a, -vn * 2 * wa / wt, ang);
            squish(b, -vn * 2 * wb / wt, ang);
          }
          const jn = -(1 + (vn < -300 ? .15 : 0)) * vn / wt;
          const vt = -rvx * ny + rvy * nx, jt = clamp(-vt / wt * .3, -jn * .4, jn * .4);
          const ix = nx * jn - ny * jt, iy = ny * jn + nx * jt;
          a.vx -= ix * wa; a.vy -= iy * wa;
          b.vx += ix * wb; b.vy += iy * wb;
        }
      }
      for (const b of bodies) {
        if (b.x <= b.r + 1 && b.vx < 0) b.vx *= -.2;
        if (b.x >= W - b.r - 1 && b.vx > 0) b.vx *= -.2;
        if (b.y >= FLOOR - b.r - 1 && b.vy > 0) {
          if (k === 0 && b.vy > 90) squish(b, b.vy, Math.PI / 2);
          b.vy *= b.vy > 300 ? -.15 : 0; b.vx *= .995;
        }
      }
    }
    for (const b of bodies) {
      const sp = Math.hypot(b.vx, b.vy);
      if (sp > 1600) { b.vx *= 1600 / sp; b.vy *= 1600 / sp; }
      b.x += b.vx * dt; b.y += b.vy * dt;
      b.a += b.vx * dt / b.r;
      b.t += dt;
    }
    // 位置层：只推开重叠，不改速度（避免“炸飞”）；同时检测合成
    for (let k = 0; k < PITER; k++) {
      for (let i = 0; i < n; i++) {
        const a = bodies[i];
        if (a.dead) continue;
        for (let j = i + 1; j < n; j++) {
          const b = bodies[j];
          if (b.dead) continue;
          const dx = b.x - a.x, dy = b.y - a.y, rs = a.r + b.r;
          const d2 = dx * dx + dy * dy, touch = rs + 4;
          if (d2 >= touch * touch) continue;
          // 挨着就算碰到（接触时两者之间可能留有 1px 缝隙）
          if (a.l === b.l && a.l < MAX && a.r === a.tr && b.r === b.tr) {
            a.dead = b.dead = true;
            merges.push([a, b]);
            break;
          }
          if (d2 >= rs * rs) continue;
          const d = Math.sqrt(d2) || 1e-4, nx = dx / d, ny = dy / d;
          const ov = Math.min(rs - d, 4) * .6;
          const wa = 1 / (a.r * a.r), wb = 1 / (b.r * b.r), wt = wa + wb;
          a.x -= nx * ov * wa / wt; a.y -= ny * ov * wa / wt;
          b.x += nx * ov * wb / wt; b.y += ny * ov * wb / wt;
        }
      }
      for (const b of bodies) {
        if (b.x < b.r) b.x = b.r;
        else if (b.x > W - b.r) b.x = W - b.r;
        if (b.y > FLOOR - b.r) b.y = FLOOR - b.r;
      }
    }
    if (merges.length) {
      bodies = bodies.filter(b => !b.dead);
      for (const [a, b] of merges) {
        const m = makeBody(a.l + 1, (a.x + b.x) / 2, (a.y + b.y) / 2, (a.vx + b.vx) / 2, (a.vy + b.vy) / 2);
        m.r = FRUITS[a.l].r;
        m.gr = (m.tr - m.r) / .15;
        m.t = 1;
        bodies.push(m);
        onMerge(m);
      }
    }
  }

  function squish(b, speed, ang) {
    const amt = Math.min(.26, speed / 2400);
    if (amt > b.sq) { b.sq = amt; b.sv = 0; b.ang = ang; }
  }

  function onMerge(m) {
    m.sq = -.2; m.sv = 0; m.ang = Math.PI / 2;
    const f = FRUITS[m.l];
    for (let i = 0; i < 8 + m.l * 2; i++) {
      const ang = rand(0, Math.PI * 2), sp = rand(120, 320 + m.l * 25);
      parts.push({ x: m.x, y: m.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 120,
        life: rand(.4, .8), max: .8, size: rand(2, 4 + m.l * .35), color: i % 3 ? f.j : f.c, g: 900 });
    }
    if (demo || over) return;
    const pts = POINTS[m.l];
    score += pts;
    floats.push({ x: m.x, y: m.y - m.r * .3, text: '+' + pts, life: 1 });
    sfx.merge(m.l);
    vibrate(12);
    if (m.l > maxLvl) {
      maxLvl = m.l;
      if (m.l === MAX) celebrate();
      else if (m.l >= 5) banner = { kicker: 'NEW SPECIMEN · 新标本', text: `${no(m.l)}  ${f.n}`, life: 1.8, max: 1.8 };
    }
  }

  function celebrate() {
    banner = { kicker: `THE WATERMELON · ${no(MAX)}`, text: '合成大西瓜', life: 3.4, max: 3.4, big: true };
    shake = .5;
    sfx.win();
    vibrate([30, 40, 30, 40, 60]);
    for (let i = 0; i < 7; i++) fireworks.push({ t: i * .28, x: rand(60, W - 60), y: rand(140, 380) });
  }

  function burst(x, y) {
    for (let i = 0; i < 46; i++) {
      const ang = (i / 46) * Math.PI * 2, sp = rand(140, 300);
      parts.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        life: rand(1, 1.5), max: 1.5, size: rand(2.5, 4.5),
        color: FRUITS[(Math.random() * FRUITS.length) | 0].j, g: 180 });
    }
    tone(180, 60, .25, 'sine', .15);
  }

  function gameOver() {
    over = true;
    sfx.over();
    vibrate(200);
    if (score > best) { best = score; store.set('xigua-best', best); }
    const f = FRUITS[maxLvl];
    $('finalScore').textContent = score;
    $('finalBest').textContent = score >= best && score > 0 ? best + ' · 新纪录' : best;
    $('finalFruit').textContent = f.n;
    $('finalMsg').textContent =
      maxLvl >= MAX ? '大西瓜，终于合成了。' :
      maxLvl >= 9 ? '只差最后一步。' :
      maxLvl >= 7 ? '离大西瓜不远了。' :
      maxLvl >= 5 ? '手感来了，再来一局。' : '热身结束，正式开始吧。';
    document.title = `我在合成大西瓜拿了 ${score} 分，你能超过我吗？`;
    setTimeout(() => $('end').classList.remove('hide'), 700);
  }

  // ---------- 更新 ----------
  function update(dt) {
    time += dt;
    let acc = dt;
    while (acc > 1e-6) { const s = Math.min(STEP, acc); step(s); acc -= s; }

    if (cooldown > 0) cooldown -= dt;
    if (shake > 0) shake -= dt;
    shownScore += (score - shownScore) * Math.min(1, dt * 10);
    if (Math.abs(score - shownScore) < .5) shownScore = score;

    for (const p of parts) { p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .99; p.life -= dt; }
    parts = parts.filter(p => p.life > 0);
    for (const f of floats) { f.y -= 50 * dt; f.life -= dt; }
    floats = floats.filter(f => f.life > 0);
    for (const fw of fireworks) { fw.t -= dt; if (fw.t <= 0) burst(fw.x, fw.y); }
    fireworks = fireworks.filter(fw => fw.t > 0);
    if (banner && (banner.life -= dt) <= 0) banner = null;

    if (demo) {
      demoT -= dt;
      if (demoT <= 0) {
        demoT = rand(.5, .9);
        const l = (Math.random() * 5) | 0, r = FRUITS[l].r;
        bodies.push(makeBody(l, rand(r, W - r), HOVER_Y, rand(-40, 40), 0));
        if (bodies.some(b => b.t > 1.5 && b.y - b.r < DEAD + 40)) bodies = [];
      }
    } else if (!over) {
      if (bodies.some(b => b.t > 1.2 && b.y - b.r < DEAD)) {
        dangerT += dt;
        if (dangerT > 1.8) gameOver();
      } else dangerT = 0;
    }
  }

  // ---------- 绘制 ----------
  function drawFruit(l, x, y, r, a, alpha, sq, ang) {
    const sp = sprites[l], sz = sp.size * r / FRUITS[l].r, h = sz / 2;
    ctx.save();
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.translate(x, y);
    if (sq) { ctx.rotate(ang); ctx.scale(1 - sq, 1 + sq * .75); ctx.rotate(-ang); }
    ctx.drawImage(sp.base, -h, -h, sz, sz);
    ctx.rotate(a);
    ctx.drawImage(sp.detail, -h, -h, sz, sz);
    ctx.rotate(-a);
    ctx.drawImage(sp.gloss, -h, -h, sz, sz);
    ctx.restore();
  }

  function text(str, x, y, o) {
    ctx.font = `${o.italic ? 'italic ' : ''}${o.weight || 400} ${o.size}px ${o.serif ? SERIF : SANS}`;
    ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
    if ('letterSpacing' in ctx) ctx.letterSpacing = (o.spacing || 0) + 'px';
    ctx.fillStyle = o.color || INK;
    ctx.fillText(str, x, y);
    if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
  }
  const label = (str, x, y, align) => text(str, x, y, { size: 9, spacing: 2.2, color: 'rgba(31,27,22,.45)', align, weight: 500 });

  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#f2eee7'; ctx.fillRect(0, 0, cw, ch);
    const vg = ctx.createRadialGradient(cw / 2, ch * .45, 0, cw / 2, ch * .45, Math.max(cw, ch) * .75);
    vg.addColorStop(0, 'rgba(255,255,255,.55)'); vg.addColorStop(1, 'rgba(214,204,190,.35)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, cw, ch);

    let sx = 0, sy = 0;
    if (shake > 0) { sx = rand(-5, 5) * shake; sy = rand(-5, 5) * shake; }
    ctx.setTransform(sc * dpr, 0, 0, sc * dpr, (ox + sx) * dpr, (oy + sy) * dpr);

    // 玻璃展柜：细线侧壁 + 地面
    ctx.strokeStyle = 'rgba(31,27,22,.1)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(.5, DEAD - 20); ctx.lineTo(.5, FLOOR);
    ctx.moveTo(W - .5, DEAD - 20); ctx.lineTo(W - .5, FLOOR);
    ctx.stroke();
    const fl = ctx.createLinearGradient(0, FLOOR, 0, FLOOR + 26);
    fl.addColorStop(0, 'rgba(120,95,65,.12)'); fl.addColorStop(1, 'rgba(120,95,65,0)');
    ctx.fillStyle = fl; ctx.fillRect(0, FLOOR, W, 26);
    ctx.strokeStyle = 'rgba(31,27,22,.3)';
    ctx.beginPath(); ctx.moveTo(0, FLOOR + .5); ctx.lineTo(W, FLOOR + .5); ctx.stroke();
    label('A STUDY IN FRUIT JELLY', 0, FLOOR + 20, 'left');
    label(`${no(0)} — ${no(MAX)}`, W - 50, FLOOR + 20, 'right');

    // 警戒线
    const danger = !demo && bodies.some(b => b.t > .8 && b.y - b.r < DEAD + 70);
    const pulse = .5 + .5 * Math.sin(time * 10);
    ctx.save();
    ctx.setLineDash([2, 5]); ctx.lineWidth = 1;
    ctx.strokeStyle = danger ? `rgba(200,69,47,${.5 + .5 * pulse})` : 'rgba(31,27,22,.22)';
    ctx.beginPath(); ctx.moveTo(0, DEAD); ctx.lineTo(W, DEAD); ctx.stroke();
    ctx.restore();
    if (!demo) text('LIMIT', W - 2, DEAD - 9, { size: 8, spacing: 2, align: 'right', weight: 500,
      color: danger ? `rgba(200,69,47,${.6 + .4 * pulse})` : 'rgba(31,27,22,.35)' });

    // 瞄准线 + 待放水果
    if (!over && cooldown <= 0) {
      const r = FRUITS[cur].r, x = clamp(aimX, r, W - r);
      const al = ctx.createLinearGradient(0, HOVER_Y + r, 0, FLOOR);
      al.addColorStop(0, 'rgba(31,27,22,.22)'); al.addColorStop(1, 'rgba(31,27,22,0)');
      ctx.strokeStyle = al; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, HOVER_Y + r + 4); ctx.lineTo(x, FLOOR); ctx.stroke();
      drawFruit(cur, x, HOVER_Y + Math.sin(time * 3) * 2, r, 0, 1, Math.sin(time * 4.5) * .035, Math.PI / 2);
    }

    for (const b of bodies) drawFruit(b.l, b.x, b.y, b.r, b.a, 1, b.sq, b.ang);

    for (const p of parts) {
      ctx.globalAlpha = clamp(p.life / p.max * 1.3, 0, 1) * .85;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.6)';
      ctx.beginPath(); ctx.arc(p.x - p.size * .3, p.y - p.size * .3, p.size * .3, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const f of floats) {
      ctx.globalAlpha = clamp(f.life * 2, 0, 1);
      text(f.text, f.x, f.y, { size: 20, serif: true, italic: true });
    }
    ctx.globalAlpha = 1;

    // 分数 & 下一个
    if (!demo) {
      label('SCORE', 22, 30, 'left');
      text(String(Math.round(shownScore)), 20, 68, { size: 46, serif: true, align: 'left' });
      label('BEST  ' + Math.max(best, score), 22, 102, 'left');
      label('NEXT', W - 22, 30, 'right');
      drawFruit(next, W - 44, 66, Math.min(22, FRUITS[next].r), 0);
      text(FRUITS[next].n, W - 44, 102, { size: 11, serif: true, color: 'rgba(31,27,22,.6)' });
      if (dropped === 0 && !over) {
        ctx.globalAlpha = .55 + .35 * Math.sin(time * 2.5);
        text('拖动瞄准 · 松手放下', W / 2, 420, { size: 15, serif: true, italic: true, color: '#7d756b', spacing: 1 });
        ctx.globalAlpha = 1;
      }
    }

    if (banner) {
      const t = banner.max - banner.life, a = clamp(Math.min(t * 4, banner.life * 2), 0, 1);
      const y = 300 - (1 - Math.min(1, t * 3)) * 12;
      const bw = banner.big ? 250 : 200, bh = banner.big ? 96 : 74;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(251,249,245,.88)';
      ctx.strokeStyle = 'rgba(31,27,22,.08)';
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(W / 2 - bw / 2, y - bh / 2, bw, bh, 16); else ctx.rect(W / 2 - bw / 2, y - bh / 2, bw, bh);
      ctx.fill(); ctx.stroke();
      label(banner.kicker, W / 2, y - bh / 2 + 20);
      text(banner.text, W / 2, y + (banner.big ? 12 : 9), { size: banner.big ? 34 : 24, serif: true, weight: 500, spacing: 2 });
      ctx.restore();
    }
  }

  // ---------- 开始页的插图 ----------
  function paintIcon(c, l, css) {
    const sp = sprites[l];
    if (!sp) return;
    const d = Math.min(window.devicePixelRatio || 1, 3);
    c.width = c.height = Math.round(css * d);
    const g = c.getContext('2d');
    const s = c.width / sp.base.width;
    g.save(); g.scale(s, s);
    g.drawImage(sp.base, 0, 0);
    g.drawImage(sp.detail, 0, 0);
    g.drawImage(sp.gloss, 0, 0);
    g.restore();
  }
  const chainEl = $('chain');
  FRUITS.forEach((f, l) => {
    const c = document.createElement('canvas');
    c.title = f.n;
    chainEl.appendChild(c);
  });
  function paintIcons() {
    paintIcon($('hero'), MAX, 132);
    [...chainEl.children].forEach((c, l) => paintIcon(c, l, 22));
  }

  // ---------- 输入 ----------
  const toWorldX = e => (e.clientX - ox) / sc;
  cv.addEventListener('pointerdown', e => { if (over) return; aiming = true; aimX = toWorldX(e); });
  cv.addEventListener('pointermove', e => { if (over) return; aimX = toWorldX(e); });
  cv.addEventListener('pointerup', e => {
    if (over || !aiming) return;
    aiming = false; aimX = toWorldX(e); drop(aimX);
  });
  cv.addEventListener('pointercancel', () => { aiming = false; });
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  document.addEventListener('contextmenu', e => e.preventDefault());

  function startGame() {
    unlockAudio();
    $('start').classList.add('hide');
    $('end').classList.add('hide');
    reset(false);
    over = false;
    cooldown = .3;
  }
  $('go').addEventListener('click', startGame);
  $('again').addEventListener('click', startGame);
  $('snd').addEventListener('click', () => {
    unlockAudio();
    muted = !muted;
    $('snd').classList.toggle('muted', muted);
  });

  if (best) $('bestStart').textContent = '最高分 ' + best;

  // ---------- 主循环 ----------
  window.addEventListener('resize', resize);
  resize();
  reset(true);
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
